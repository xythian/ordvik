# Regenerates the RFC indexes after an RFC lands on the default branch. The index rows
# (each scope README's "| RFC |" table, and the project-scope tables in
# docs/rfcs/README.md) are generated from the RFCs' own headers by
# `scripts/rfc index`, so an RFC's PR edits only its own file and two RFC
# PRs never conflict on neighbouring index rows.
#
# When the default branch's indexes are stale, this force-pushes the regenerated
# tables to the rfc-index/regenerate branch and opens a PR from it if none
# is open. rfc-reservation merges that PR once ci and attribution pass on
# it (`scripts/rfc verify-index`: it changes only RFC READMEs, and they
# match what `rfc index` generates), as it does reservations. One branch
# means one PR at a time: a later RFC merge refreshes it.
#
# A PR that leaves an index stale is not failed: the rows are the default
# branch's to keep, and checking them on a PR would bring the conflicts back.
#
# The push and the PR use a token from the rfc-reservation GitHub App, so
# that ci runs on the PR (a GITHUB_TOKEN push starts no workflows). Its key
# is a secret of the rfc-reservation environment, which only the default
# branch's workflows can use (set up with rfc-reservation.yml, /ordvik:init).
name: rfc-index

on:
  push:
    branches: [master]  # the default branch
    paths:
      - "**/rfcs/**"
      - scripts/rfc
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rfc-index
  cancel-in-progress: false

jobs:
  regenerate:
    # ubuntu-latest: the job holds the reservation App's key.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: rfc-reservation
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          # The push below authenticates as the App, not GITHUB_TOKEN.
          persist-credentials: false

      - name: Regenerate
        id: index
        run: |
          changed=$(python3 scripts/rfc index --write | tr '\n' ' ')
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ -n "$changed" ]; then echo "Stale: $changed"; else echo "The RFC indexes are current."; fi

      - name: Mint the App token
        id: app
        if: ${{ steps.index.outputs.changed }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RFC_APP_ID }}
          private-key: ${{ secrets.RFC_APP_PRIVATE_KEY }}

      # curl and jq, not gh, which not every runner image has.
      - name: Push the branch and open the pull request
        if: ${{ steps.index.outputs.changed }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BASE: ${{ github.event.repository.default_branch }}
          CHANGED: ${{ steps.index.outputs.changed }}
          HEAD: rfc-index/regenerate
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$HEAD"
          git add $CHANGED
          git commit -q -m "docs(rfc): regenerate the RFC indexes" \
            -m "Generated by scripts/rfc index from the RFC headers."
          git push -q --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$HEAD"
          api() {
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"
          }
          open=$(api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls?state=open&base=$BASE&head=${GITHUB_REPOSITORY_OWNER}:$HEAD" | jq length)
          if [ "$open" -gt 0 ]; then
            echo "Its pull request is open; the push updated it."
            exit 0
          fi
          jq -n --arg base "$BASE" --arg head "$HEAD" '{
            base: $base, head: $head,
            title: "docs(rfc): regenerate the RFC indexes",
            body: "Generated by `scripts/rfc index` from the RFC headers after an RFC changed on the default branch. rfc-reservation merges it once its checks pass."
          }' | api -X POST "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls" -d @- | jq -r .html_url
