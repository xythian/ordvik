# Tests for the ordvik CLI and planning library. Runs only when Go code or
# the contract tests change, so skill and docs PRs cost no minutes.
name: ci

on:
  pull_request:
    paths: ["**.go", "go.mod", "go.sum", "tests/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["**.go", "go.mod", "go.sum", "tests/**", ".github/workflows/ci.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: python3 -c "import yaml" || pip install pyyaml
      - run: go vet ./...
      - run: go test ./...
